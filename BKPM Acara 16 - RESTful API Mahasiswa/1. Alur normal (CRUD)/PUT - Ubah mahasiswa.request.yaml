$kind: http-request
url: "{{base_url}}/api/mahasiswa/{{id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim": "E41250761",
      "nama": "Budi Santoso, S.Kom",
      "email": "budi.baru@example.com",
      "jurusan": "Teknologi Informasi",
      "prodi_id": 1,
      "angkatan": 2025,
      "status": "cuti"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("data berubah", function () { pm.expect(pm.response.json().data.status).to.eql("cuti"); });
    language: text/javascript
order: 4000
