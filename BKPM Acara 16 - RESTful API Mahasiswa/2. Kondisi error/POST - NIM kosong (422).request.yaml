$kind: http-request
url: "{{base_url}}/api/mahasiswa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim": "",
      "nama": "Budi Santoso",
      "email": "budi@example.com",
      "jurusan": "Teknologi Informasi",
      "prodi_id": 1,
      "angkatan": 2025
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 422", function () { pm.response.to.have.status(422); });
      pm.test("error pada nim", function () { pm.expect(pm.response.json().errors).to.have.property("nim"); });
    language: text/javascript
order: 5000
