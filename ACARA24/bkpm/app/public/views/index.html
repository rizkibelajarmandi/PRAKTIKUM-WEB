<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Mahasiswa - Integrasi API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        #status { margin: 0.5rem 0; font-style: italic; }
        #status.error { color: #b00020; }
        #status.empty { color: #666; }
        #status.loading { color: #0b5ed7; }
    </style>
</head>
<body>
    <h1>Data Mahasiswa</h1>
    <p>Data diambil dari REST API melalui Fetch API.</p>

    <!-- Tugas mandiri 1 & 2: indikator "Memuat data...", "Belum ada data", dan pesan error -->
    <p id="status"></p>

    <table id="tabel-mahasiswa">
        <thead>
            <tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
