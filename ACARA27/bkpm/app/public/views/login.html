<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 420px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Login</h1>
                <form id="form-login" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" autocomplete="username">
                        <div id="err-username" class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" autocomplete="current-password">
                        <div id="err-password" class="invalid-feedback"></div>
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary w-100">Masuk</button>
                </form>
                <p class="mt-3 mb-0 text-center"><a href="index.html">Lihat data tanpa login</a></p>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="login.js"></script>
</body>
</html>
