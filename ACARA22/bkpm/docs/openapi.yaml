openapi: 3.0.0

info:
  title: API Sistem Informasi Akademik (MVC)
  description: >
    REST API untuk autentikasi pengguna (JWT) dan pengelolaan data mahasiswa.
    Path mengikuti resource pada peta Router (bukan nama berkas .php).
  version: 1.0.0

servers:
  - url: http://localhost/PRAKTIKUM-WEB/ACARA22/bkpm/app/public
    description: Server lokal (XAMPP)

tags:
  - name: Auth
    description: Registrasi dan login pengguna
  - name: Mahasiswa
    description: Pengelolaan data mahasiswa

paths:
  /login:
    post:
      tags: [Auth]
      summary: Autentikasi pengguna (AuthController::login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil, token JWT berlaku 1 jam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Kredensial tidak valid (username atau password salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /register:
    post:
      tags: [Auth]
      summary: Registrasi pengguna (AuthController::register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          description: Username, email, dan password wajib diisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username atau email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      description: >
        Tanpa parameter id mengembalikan seluruh data (urut id terbaru).
        Dengan parameter id mengembalikan satu mahasiswa.
      parameters:
        - name: id
          in: query
          required: false
          description: ID mahasiswa (opsional)
          schema:
            type: integer
      responses:
        "200":
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahasiswaResponse"
        "404":
          description: Data tidak ditemukan (jika id tidak ada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Mahasiswa]
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahasiswaInput"
      responses:
        "201":
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          description: Field nim, nama, dan prodi wajib diisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Mahasiswa]
      summary: Memperbarui data mahasiswa (MahasiswaController::update)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID mahasiswa yang diperbarui
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahasiswaInput"
      responses:
        "200":
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Parameter id atau field nim, nama, prodi tidak lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Data mahasiswa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Mahasiswa]
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID mahasiswa yang dihapus
          schema:
            type: integer
      responses:
        "200":
          description: Data berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Parameter id wajib diisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Data mahasiswa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT dari endpoint /login (header Authorization Bearer)

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: rahasia123

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: budi
        email:
          type: string
          format: email
          example: budi@example.com
        password:
          type: string
          example: rahasia123

    MahasiswaInput:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim:
          type: string
          example: E41230001
        nama:
          type: string
          example: Budi Santoso
        prodi:
          type: string
          example: Teknik Informatika

    Mahasiswa:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nim:
          type: string
          example: E41230001
        nama:
          type: string
          example: Budi Santoso
        prodi:
          type: string
          example: Teknik Informatika

    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    MessageResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              nullable: true
              example: null

    IdResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  example: "1"

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                role:
                  type: string
                  example: admin

    MahasiswaResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/Mahasiswa"
                - type: array
                  items:
                    $ref: "#/components/schemas/Mahasiswa"

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            success:
              example: false
            data:
              nullable: true
              example: null
